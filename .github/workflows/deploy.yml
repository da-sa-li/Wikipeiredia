name: Deploy auf GitHub Pages

on:
  push:
    branches: [main]
  # Erlaubt einen Deploy von Hand über den Actions-Tab.
  workflow_dispatch:

# Nie zwei Deploys gleichzeitig; ein laufender wird zu Ende geführt.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.169.0

jobs:
  build:
    name: Bauen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          # Volle Historie, damit enableGitInfo das Änderungsdatum je Seite kennt.
          fetch-depth: 0
          # Submodule bewusst nicht hier: fetch-depth gilt auch für sie, und das
          # Relearn-Repo wiegt mit kompletter Historie 1,2 GB (3.190 Commits).
          # Der nächste Schritt holt stattdessen nur den angepinnten Commit.
          submodules: false

      - name: Theme-Submodule flach holen
        run: git submodule update --init --depth 1

      - name: Hugo installieren
        run: |
          set -euo pipefail
          curl -sSLo /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      # Die baseURL kommt aus hugo.toml (eigene Domain), nicht von Pages.
      - name: Website bauen und prüfen
        env:
          HUGO_ENVIRONMENT: production
          TZ: Europe/Berlin
        run: hugo --gc --minify --panicOnWarning

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write      # Deploy auf Pages
      id-token: write   # Herkunft des Artefakts prüfen
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
