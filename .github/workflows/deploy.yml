name: Deploy auf Firebase Hosting

on:
  push:
    branches: [main]
  # Erlaubt einen Deploy von Hand über den Actions-Tab.
  workflow_dispatch:

# Nie zwei Deploys gleichzeitig; ein laufender wird zu Ende geführt.
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

permissions:
  contents: read

env:
  HUGO_VERSION: 0.165.0

jobs:
  deploy:
    name: Bauen und veröffentlichen
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          # Das Relearn-Theme hängt als Submodule unter themes/.
          submodules: true
          # Volle Historie, damit enableGitInfo das Änderungsdatum je Seite kennt.
          fetch-depth: 0

      - name: Hugo installieren
        run: |
          set -euo pipefail
          curl -sSLo /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - name: Website bauen und prüfen
        env:
          HUGO_ENVIRONMENT: production
          TZ: Europe/Berlin
        run: ./scripts/check-build.sh

      # Die ID wird aus .firebaserc abgeleitet statt hier wiederholt: eine
      # Quelle der Wahrheit, und die Action kann trotzdem ihren Ergebnis-Link
      # bauen (ohne projectId zeigt ihre Zusammenfassung auf https://.web.app/).
      - name: Projekt-ID aus .firebaserc lesen
        id: firebase
        run: |
          set -euo pipefail
          PROJECT_ID="$(jq -er '.projects.default' .firebaserc)"
          echo "Firebase-Projekt: $PROJECT_ID"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Auf Firebase Hosting veröffentlichen
        uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ steps.firebase.outputs.project_id }}
          channelId: live
